{% extends 'base.html' %}

{% block title %}
Email Sent
{% endblock %}

{% block content %}

<div class="auth-shell">
    <div class="auth-shell__form-wrap">
        <div class="auth-card">
            <h2>Email Sent <i class="bi bi-envelope-check-fill" style="font-size:70px;color:#27AE60;"></i></h2>
            <p>
                If an account exists with the email you entered,
                you'll receive a password reset link shortly.
            </p>
            <a href="{% url 'login' %}" class="btn btn--primary">
                Back to Login
            </a>
        </div>
    </div>
</div>

{% endblock %}
